<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR Okuma Paneli</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .info {
            color: #666;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            width: fit-content;
            margin: 15px auto;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            background: #007bff;
            color: white;
        }

        .logout {
            background: #dc3545;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        Hoş geldin, {{ name }}
    </h1>

    <p class="info">
        QR okuma hesabınızla giriş yaptınız.
    </p>

    <p class="info">
        Listeye eklenmek için 
        QR kodu okutun.
    </p>


    <a
        class="button"
        href="{{ url_for('attendance_list') }}"
    >
        QR Listesine Git
    </a>


    <a
        class="button logout"
        href="{{ url_for('logout') }}"
    >
        Çıkış Yap
    </a>

</div>

</body>

</html>
